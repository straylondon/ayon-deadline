[project]
name = "ayon-deadline"
description = "AYON Deadline addon."
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = [
    "attrs",
    "ayon-core",
    "ayon-python-api",
    "clique",
    "requests",
    "semver",
]

[tool.setuptools.dynamic]
version = { attr = "ayon_deadline.version.__version__" }

[tool.uv.sources]
ayon-core = { git = "https://github.com/ynput/ayon-core", subdirectory = "client" }
